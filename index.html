<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Responsive real-time weather application using OpenWeather API"
    >

    <title>Weather App | Cognetix Technology</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="weather-day">

    <main class="weather-app">

        <section class="weather-panel">

            <!-- =================================
                 LOCATION
            ================================== -->

            <div class="location-section">

                <span class="weather-label">
                    CURRENT WEATHER
                </span>

                <div class="location-row">

                    <h1 id="cityName">
                        City Name
                    </h1>

                    <span class="location-dot"></span>

                </div>

                <p id="weatherDescription">
                    Search for a city
                </p>

            </div>


            <!-- =================================
                 WEATHER VISUAL
            ================================== -->

            <div class="weather-visual">

                <!-- ==============================
                     SUN
                =============================== -->

                <div
                    id="sunVisual"
                    class="celestial sun"
                    aria-label="Sunny weather"
                >

                    <div class="sun-glow"></div>

                    <div class="sun-core"></div>

                    <div class="sun-highlight"></div>

                </div>


                <!-- ==============================
                     MOON
                =============================== -->

                <div
                    id="moonVisual"
                    class="celestial moon"
                    aria-label="Night weather"
                >

                    <div class="moon-glow"></div>

                    <div class="moon-crescent">

                        <span class="moon-crater crater-one"></span>

                        <span class="moon-crater crater-two"></span>

                        <span class="moon-crater crater-three"></span>

                        <span class="moon-crater crater-four"></span>

                    </div>

                </div>


                <!-- ==============================
                     CLOUD / RAIN / SNOW ICON
                =============================== -->

                <img
                    id="weatherIcon"
                    src=""
                    alt="Weather condition"
                >

            </div>


            <!-- =================================
                 TEMPERATURE
            ================================== -->

            <div class="temperature-section">

                <span id="temperature">
                    --
                </span>

                <span id="temperatureUnit">
                    °C
                </span>

            </div>


            <!-- =================================
                 WEATHER DETAILS
            ================================== -->

            <div class="weather-details">

                <div class="weather-detail">

                    <div class="detail-symbol">
                        💧
                    </div>

                    <div class="detail-content">

                        <span>
                            Humidity
                        </span>

                        <strong id="humidity">
                            --%
                        </strong>

                    </div>

                </div>


                <div class="weather-detail">

                    <div class="detail-symbol">
                        💨
                    </div>

                    <div class="detail-content">

                        <span>
                            Wind Speed
                        </span>

                        <strong id="windSpeed">
                            -- m/s
                        </strong>

                    </div>

                </div>


                <div class="weather-detail">

                    <div class="detail-symbol">
                        🌡️
                    </div>

                    <div class="detail-content">

                        <span>
                            Feels Like
                        </span>

                        <strong id="feelsLike">
                            --°C
                        </strong>

                    </div>

                </div>

            </div>


            <!-- =================================
                 TEMPERATURE TOGGLE
            ================================== -->

            <div class="unit-toggle">

                <button
                    type="button"
                    id="celsiusBtn"
                    class="unit-btn active"
                >
                    °C
                </button>

                <button
                    type="button"
                    id="fahrenheitBtn"
                    class="unit-btn"
                >
                    °F
                </button>

            </div>


            <!-- =================================
                 SEARCH
            ================================== -->

            <div class="search-section">

                <form
                    id="searchForm"
                    class="search-form"
                >

                    <div class="search-input-wrapper">

                        <span class="search-symbol">
                            ⌕
                        </span>

                        <label
                            for="cityInput"
                            class="sr-only"
                        >
                            Enter city name
                        </label>

                        <input
                            type="text"
                            id="cityInput"
                            placeholder="Search for a city..."
                            autocomplete="off"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        id="searchBtn"
                    >
                        Search
                    </button>

                </form>

            </div>


            <!-- =================================
                 ERROR
            ================================== -->

            <div
                id="errorMessage"
                class="error-message"
                role="alert"
            ></div>


            <!-- =================================
                 LOADING
            ================================== -->

            <div
                id="loading"
                class="loading"
            >

                <span class="loader"></span>

                Getting weather...

            </div>


            <!-- =================================
                 FOOTER
            ================================== -->

            <footer>
                Powered by OpenWeather API
            </footer>

        </section>

    </main>


    <script src="config.js"></script>
    <script src="script.js"></script>

</body>

</html>
